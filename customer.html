    <!-- FIREBASE MODULE & APPLICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut,
            updateProfile,
            updatePassword
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getDatabase,
            ref,
            get,
            set,
            push,
            update,
            remove,
            onValue,
            off
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Modular Firebase Configuration matching index.html
        const firebaseConfig = {
            apiKey: "AIzaSyBfmm4RSOckkFvAFMWrTPuF38koEz2kAkE",
            authDomain: "yukti-247.firebaseapp.com",
            databaseURL: "https://yukti-247-default-rtdb.firebaseio.com",
            projectId: "yukti-247",
            storageBucket: "yukti-247.firebasestorage.app",
            messagingSenderId: "244123454826",
            appId: "1:244123454826:web:56b4d88c3628bb06cfa913",
            measurementId: "G-6BGFCBKTD7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // State Management
        let currentUser = null;
        let customerProfile = null;
        let currentSection = 'home';
        let activeDbListeners = [];
        let userCart = {};
        let userOrders = [];
        let userReservations = [];
        let userFavorites = {};
        let userNotifications = [];
        let userAddresses = [];
        let activeMenu = [];
        let currentCustomItem = null;
        let confirmResolver = null;

        // Authenticated Route Guard & Init
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            // Role Verification Guard
            try {
                const userSnapshot = await get(ref(db, `users/${user.uid}`));
                if (!userSnapshot.exists()) {
                    window.location.href = 'index.html';
                    return;
                }

                const role = userSnapshot.val().role || 'CUSTOMER';
                if (role === 'PARTNER') {
                    window.location.href = 'partner.html';
                    return;
                } else if (role === 'ADMIN' || role === 'STAFF') {
                    window.location.href = 'admin.html';
                    return;
                } else if (role !== 'CUSTOMER') {
                    window.location.href = 'index.html';
                    return;
                }

                // Load initial profile data
                const custSnapshot = await get(ref(db, `customers/${user.uid}`));
                customerProfile = custSnapshot.exists() ? custSnapshot.val() : { name: user.displayName || 'Valued Guest', email: user.email };

                updateHeaderUserUI();
                setupRealtimeSubscriptions();

                // Handle hash navigation
                const hash = window.location.hash.replace('#', '') || 'home';
                navigateTo(hash);

            } catch (err) {
                showToast("Security verification error. Access denied.", "error");
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        });

        function updateHeaderUserUI() {
            const name = customerProfile.name || currentUser.displayName || 'Guest';
            document.getElementById('headerUserName').innerText = name.split(' ')[0];
            document.getElementById('headerAvatar').innerText = name.charAt(0).toUpperCase();
        }

        // Realtime Subscription Handlers
        function setupRealtimeSubscriptions() {
            clearDbListeners();

            // 1. Cart Listener
            const cartRef = ref(db, `carts/${currentUser.uid}`);
            const cartUnsub = onValue(cartRef, (snap) => {
                userCart = snap.val() || {};
                updateCartBadges();
                renderCartDrawer();
            });
            activeDbListeners.push({ ref: cartRef, unsub: cartUnsub });

            // 2. Notifications Listener
            const notifRef = ref(db, `notifications/${currentUser.uid}`);
            const notifUnsub = onValue(notifRef, (snap) => {
                const data = snap.val() || {};
                userNotifications = Object.keys(data).map(k => ({ id: k, ...data[k] }));
                const unread = userNotifications.filter(n => !n.read).length;
                const badge = document.getElementById('headerNotifBadge');
                if (unread > 0) {
                    badge.innerText = unread;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            });
            activeDbListeners.push({ ref: notifRef, unsub: notifUnsub });

            // 3. Favorites Listener
            const favRef = ref(db, `favorites/${currentUser.uid}`);
            const favUnsub = onValue(favRef, (snap) => {
                userFavorites = snap.val() || {};
            });
            activeDbListeners.push({ ref: favRef, unsub: favUnsub });
        }

        function clearDbListeners() {
            activeDbListeners.forEach(item => off(item.ref));
            activeDbListeners = [];
        }

        // Global Navigation Handler
        window.navigateTo = (sectionId) => {
            currentSection = sectionId;
            window.location.hash = sectionId;

            // Highlight Active Links
            document.querySelectorAll('#navLinksContainer .nav-item').forEach(el => {
                if (el.getAttribute('data-target') === sectionId) {
                    el.className = "nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold bg-emeraldPrimary/10 text-emeraldPrimary border border-emeraldPrimary/20 transition";
                } else {
                    el.className = "nav-item w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-semibold text-textMuted hover:bg-white/5 hover:text-white transition";
                }
            });

            document.querySelectorAll('.mobile-nav-item').forEach(el => {
                if (el.getAttribute('data-target') === sectionId) {
                    el.classList.add('text-goldAccent');
                    el.classList.remove('text-textMuted');
                } else {
                    el.classList.remove('text-goldAccent');
                    el.classList.add('text-textMuted');
                }
            });

            toggleSidebar(false);

            // Render view
            const main = document.getElementById('mainContent');
            switch (sectionId) {
                case 'home': renderHomeView(main); break;
                case 'menu': renderMenuView(main); break;
                case 'orders': renderOrdersView(main); break;
                case 'reservations': renderReservationsView(main); break;
                case 'favorites': renderFavoritesView(main); break;
                case 'addresses': renderAddressesView(main); break;
                case 'notifications': renderNotificationsView(main); break;
                case 'invoices': renderInvoicesView(main); break;
                case 'support': renderSupportView(main); break;
                case 'profile': renderProfileView(main); break;
                default: renderHomeView(main); break;
            }
        };

        // UI Interactions
        window.toggleSidebar = (show) => {

                </div>
            `;

            const grid = document.getElementById('favoritesListGrid');
            if (favKeys.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full glass-card rounded-2xl p-12 text-center text-textMuted space-y-2">
                        <i class="fa-solid fa-heart text-4xl text-red-400/50"></i>
                        <h4 class="font-serif text-base font-bold text-white">No favorites saved yet</h4>
                        <p class="text-xs">Tap the heart icon on any dish to save it here.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = favKeys.map(key => {
                const item = userFavorites[key];
                return `
                    <div class="glass-card rounded-2xl p-4 flex items-center justify-between border border-white/10">
                        <div>
                            <h4 class="font-serif text-sm font-bold text-white">${item.name || 'Favorite Item'}</h4>
                            <span class="text-xs text-goldAccent font-bold">₹${item.price || '0'}</span>
                        </div>
                        <button onclick="toggleFavorite('${key}', '')" class="text-red-400 p-2 hover:opacity-80">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        window.toggleFavorite = async (itemId, name) => {
            if (userFavorites[itemId]) {
                await remove(ref(db, `favorites/${currentUser.uid}/${itemId}`));
                showToast("Removed from favorites", "info");
            } else {
                await set(ref(db, `favorites/${currentUser.uid}/${itemId}`), { name, itemId, addedAt: new Date().toISOString() });
                showToast("Added to favorites!", "success");
            }
            if (currentSection === 'favorites') renderFavoritesView(document.getElementById('mainContent'));
        };

        // 6. ADDRESS MANAGER
        async function renderAddressesView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="font-serif text-2xl font-bold text-white">Saved Addresses</h2>
                        <p class="text-xs text-textMuted">Manage delivery destinations for fast checkout.</p>
                    </div>

                    <!-- Add Address Form -->
                    <form onsubmit="handleSaveAddress(event)" class="glass-card rounded-3xl p-6 space-y-4 border border-white/10">
                        <h3 class="font-serif text-base font-bold text-goldAccent">Add New Address</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <input type="text" id="addrLabel" required placeholder="Label (Home, Work, Villa)" class="px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent">
                            <input type="text" id="addrPhone" required placeholder="Contact Phone" class="px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent">
                        </div>
                        <textarea id="addrText" required rows="2" placeholder="Full Street Address, Apartment / Suite, Landmark" class="w-full px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent"></textarea>
                        <button type="submit" class="py-2.5 px-6 rounded-xl bg-emeraldPrimary text-bgDark font-bold text-xs hover:bg-emeraldHover transition">
                            Save Address
                        </button>
                    </form>

                    <div id="addressesContainerList" class="space-y-3"></div>
                </div>
            `;

            loadAddressesList();
        }

        async function loadAddressesList() {
            const container = document.getElementById('addressesContainerList');
            if (!container) return;

            try {
                const snap = await get(ref(db, `addresses/${currentUser.uid}`));
                userAddresses = snap.exists() ? Object.keys(snap.val()).map(k => ({ id: k, ...snap.val()[k] })) : [];
            } catch (e) { userAddresses = []; }

            if (userAddresses.length === 0) {
                container.innerHTML = `<p class="text-xs text-textMuted text-center py-4">No addresses saved yet.</p>`;
                return;
            }

            container.innerHTML = userAddresses.map(a => `
                <div class="glass-card rounded-2xl p-4 border border-white/10 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-bold text-goldAccent">${a.label}</span>
                        <p class="text-xs text-white mt-1">${a.address}</p>
                        <span class="text-[10px] text-textMuted">${a.phone}</span>
                    </div>
                    <button onclick="deleteAddress('${a.id}')" class="text-red-400 p-2 text-xs hover:opacity-80">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        window.handleSaveAddress = async (e) => {
            e.preventDefault();
            const label = document.getElementById('addrLabel').value;
            const phone = document.getElementById('addrPhone').value;
            const address = document.getElementById('addrText').value;

            try {
                await push(ref(db, `addresses/${currentUser.uid}`), { label, phone, address, createdAt: new Date().toISOString() });
                showToast("Address saved successfully!", "success");
                loadAddressesList();
            } catch (err) {
                showToast("Address Error: " + err.message, "error");
            }
        };

        window.deleteAddress = async (addrId) => {
            await remove(ref(db, `addresses/${currentUser.uid}/${addrId}`));
            showToast("Address deleted.", "info");
            loadAddressesList();
        };

        // 7. NOTIFICATIONS VIEW
        async function renderNotificationsView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="font-serif text-2xl font-bold text-white">Notifications Center</h2>
                        <p class="text-xs text-textMuted">Order updates and promotional offers.</p>
                    </div>
                    <div id="notifListDisplay" class="space-y-3"></div>
                </div>
            `;

            const list = document.getElementById('notifListDisplay');
            if (userNotifications.length === 0) {
                list.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-xs text-textMuted">You're all caught up! No notifications.</div>`;
                return;
            }

            list.innerHTML = userNotifications.map(n => `
                <div class="glass-card rounded-2xl p-4 border border-white/10 flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emeraldPrimary/10 text-emeraldPrimary flex items-center justify-center flex-shrink-0 text-xs">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-white">${n.title || 'Notification'}</h4>
                        <p class="text-xs text-textMuted mt-0.5">${n.message || ''}</p>
                    </div>
                </div>
            `).join('');
        }

        // 8. INVOICES VIEW
        async function renderInvoicesView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="font-serif text-2xl font-bold text-white">Order Invoices</h2>
                        <p class="text-xs text-textMuted">Download official tax invoices for completed orders.</p>
                    </div>
                    <div class="glass-card rounded-2xl p-8 text-center text-textMuted space-y-2">
                        <i class="fa-solid fa-file-invoice text-3xl text-goldAccent"></i>
                        <p class="text-xs">Invoices generated automatically upon order completion.</p>
                    </div>
                </div>
            `;
        }

        // 9. SUPPORT CENTER
        async function renderSupportView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="font-serif text-2xl font-bold text-white">Guest Support Center</h2>
                        <p class="text-xs text-textMuted">Submit inquiries or report issues regarding your dining experience.</p>
                    </div>

                    <form onsubmit="handleSupportSubmit(event)" class="glass-card rounded-3xl p-6 space-y-4 border border-white/10">
                        <div>
                            <label class="block text-xs font-bold uppercase text-textMuted mb-1">Subject</label>
                            <input type="text" id="ticketSubject" required placeholder="e.g. Query regarding Order #BE102" class="w-full px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-textMuted mb-1">Issue Description</label>
                            <textarea id="ticketBody" required rows="4" placeholder="Describe your concern in detail..." class="w-full px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent"></textarea>
                        </div>
                        <button type="submit" class="py-3 px-6 rounded-xl bg-goldAccent text-bgDark font-bold text-xs hover:opacity-90 transition">
                            Submit Support Ticket
                        </button>
                    </form>
                </div>
            `;
        }

        window.handleSupportSubmit = async (e) => {
            e.preventDefault();
            const subject = document.getElementById('ticketSubject').value;
            const description = document.getElementById('ticketBody').value;

            try {
                await push(ref(db, 'supportTickets'), {
                    customerId: currentUser.uid,
                    subject,
                    description,
                    status: 'OPEN',
                    createdAt: new Date().toISOString()
                });
                showToast("Ticket submitted! Concierge team will respond shortly.", "success");
                e.target.reset();
            } catch (err) {
                showToast("Ticket error: " + err.message, "error");
            }
        };

        // 10. PROFILE & SECURITY VIEW
        async function renderProfileView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="font-serif text-2xl font-bold text-white">Profile & Security</h2>
                        <p class="text-xs text-textMuted">Manage your personal details and authentication credentials.</p>
                    </div>

                    <form onsubmit="handleUpdateProfile(event)" class="glass-card rounded-3xl p-6 space-y-4 border border-white/10">
                        <h3 class="font-serif text-base font-bold text-goldAccent">Personal Information</h3>
                        <div>
                            <label class="block text-xs font-bold uppercase text-textMuted mb-1">Full Name</label>
                            <input type="text" id="profName" value="${customerProfile.name || ''}" required class="w-full px-3 py-2.5 rounded-xl bg-bgDark border border-white/10 text-xs text-white focus:outline-none focus:border-goldAccent">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-textMuted mb-1">Email Address</label>
                            <input type="email" value="${currentUser.email}" disabled class="w-full px-3 py-2.5 rounded-xl bg-bgDark/50 border border-white/5 text-xs text-textMuted cursor-not-allowed">
                        </div>
                        <button type="submit" class="py-2.5 px-6 rounded-xl bg-emeraldPrimary text-bgDark font-bold text-xs hover:bg-emeraldHover transition">
                            Save Profile
                        </button>
                    </form>
                </div>
            `;
        }

        window.handleUpdateProfile = async (e) => {
            e.preventDefault();
            const name = document.getElementById('profName').value;

            try {
                await updateProfile(currentUser, { displayName: name });
                await update(ref(db, `customers/${currentUser.uid}`), { name, updatedAt: new Date().toISOString() });
                customerProfile.name = name;
                updateHeaderUserUI();
                showToast("Profile updated successfully!", "success");
            } catch (err) {
                showToast("Update Error: " + err.message, "error");
            }
        };

        // CART & CHECKOUT LOGIC
        function renderCartDrawer() {
            const container = document.getElementById('cartDrawerItems');
            if (!container) return;

            const items = Object.values(userCart);
            if (items.length === 0) {
                container.innerHTML = `<p class="text-xs text-textMuted text-center py-8">Your cart is empty.</p>`;
                document.getElementById('drawerSubtotal').innerText = '₹0';
                document.getElementById('drawerTax').innerText = '₹0';
                document.getElementById('drawerTotal').innerText = '₹0';
                return;
            }

            let subtotal = 0;
            container.innerHTML = items.map(i => {
                subtotal += (i.price * i.quantity);
                return `
                    <div class="glass-card rounded-2xl p-3 border border-white/10 flex items-center justify-between">
                        <div>
                            <h4 class="text-xs font-bold text-white">${i.name}</h4>
                            <span class="text-xs text-goldAccent font-bold">₹${i.price} × ${i.quantity}</span>
                        </div>
                        <button onclick="removeFromCart('${i.itemId}')" class="text-red-400 p-1 text-xs hover:opacity-80">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            const tax = Math.round(subtotal * 0.05);
            const total = subtotal + tax;

            document.getElementById('drawerSubtotal').innerText = `₹${subtotal}`;
            document.getElementById('drawerTax').innerText = `₹${tax}`;
            document.getElementById('drawerTotal').innerText = `₹${total}`;
        }

        window.removeFromCart = async (itemId) => {
            await remove(ref(db, `carts/${currentUser.uid}/${itemId}`));
            showToast("Item removed from cart", "info");
        };

        window.triggerCheckout = async () => {
            const items = Object.values(userCart);
            if (items.length === 0) {
                showToast("Cart is empty!", "error");
                return;
            }

            const subtotal = items.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const total = subtotal + Math.round(subtotal * 0.05);

            try {
                const newOrderRef = push(ref(db, 'orders'));
                await set(newOrderRef, {
                    orderId: newOrderRef.key,
                    customerId: currentUser.uid,
                    customerName: customerProfile.name || currentUser.displayName || 'Guest',
                    items,
                    total,
                    status: 'PENDING',
                    createdAt: new Date().toISOString()
                });

                // Clear cart
                await remove(ref(db, `carts/${currentUser.uid}`));

                showToast("Order placed successfully!", "success");
                navigateTo('orders');
            } catch (err) {
                showToast("Order creation failed: " + err.message, "error");
            }
        };

        // SIGN OUT HANDLER
        window.handleSignOut = async () => {
            try {
                clearDbListeners();
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (err) {
                showToast("Sign out error: " + err.message, "error");
            }
        };

        // UI HELPER: TOAST NOTIFICATIONS
        window.showToast = (msg, type = "info") => {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emeraldPrimary text-bgDark' : type === 'error' ? 'bg-red-500 text-white' : 'bg-goldAccent text-bgDark';

            toast.className = `px-4 py-3 rounded-xl font-bold text-xs shadow-2xl transition duration-300 transform translate-y-2 pointer-events-auto flex items-center space-x-2 ${bgClass}`;
            toast.innerHTML = `<span>${msg}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };
    </script>
</body>
</html>
